<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Everything Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317242F'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23E4F222' font-family='sans-serif' font-weight='bold'%3E%E2%88%97%3C/text%3E%3C/svg%3E">
<style>
/* ————— Shipshape's design system, applied to the board —————
   Same tokens, same fonts, same light and dark, same sheet behaviour. The class
   names are the board's own so its script needs no changes; only what they look
   like moved house. */
:root{
  --blue:#007aff; --green:#34c759; --orange:#ff9500; --red:#ff3b30;
  --purple:#af52de; --pink:#ff375f; --teal:#32ade6; --indigo:#5856d6; --yellow:#ffcc00;
  --gray:#8e8e93;
  --bg:#f2f2f7; --card:#fff; --card2:#fff; --elev:rgba(255,255,255,.72);
  --label:#000; --label2:#3c3c4399; --label3:#3c3c434d; --sep:#3c3c4326;
  --fill:#78788033; --fill2:#7878801f;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --sheet:#fff; --r:14px;
  --ease:cubic-bezier(.32,.72,0,1);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --round:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a;
  --purple:#bf5af2; --pink:#ff375f; --teal:#64d2ff; --indigo:#5e5ce6; --yellow:#ffd60a; --gray:#98989d;
  --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --elev:rgba(30,30,32,.76);
  --label:#fff; --label2:#ebebf599; --label3:#ebebf54d; --sep:#54545899;
  --fill:#7878805c; --fill2:#78788033;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.5); --sheet:#1c1c1e;
} html{color-scheme:dark}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--label);min-height:100vh;font-family:var(--sans);
  font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;padding:0}
img{max-width:100%;display:block}
a{color:var(--blue)}
::selection{background:color-mix(in srgb,var(--yellow) 45%,transparent)}
mark{background:color-mix(in srgb,var(--yellow) 55%,transparent);color:var(--label);padding:0 2px;border-radius:3px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px;border-radius:6px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--fill);border-radius:8px}
.dotgrid{background-image:radial-gradient(color-mix(in srgb,var(--label3) 60%,transparent) 1.1px,transparent 1.1px);background-size:22px 22px}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:scale(1);opacity:1}}
.card-enter{animation:pop .18s ease-out}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.wrap{max-width:1100px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left))}

/* ————— header, the Shipshape way ————— */
header{position:sticky;top:0;z-index:40;background:var(--elev);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);padding:8px 0 10px}
.hrow{display:flex;align-items:flex-end;gap:8px;padding-top:4px}
.backship{display:grid;place-items:center;flex:none;margin-bottom:2px}
.backship img{display:block;border-radius:8px;width:30px;height:30px}
h1.bh{font-family:var(--round);font-size:28px;line-height:1.1;letter-spacing:-.5px;font-weight:800;flex:1;min-width:0}
h1.bh .sub{display:block;font-size:12px;font-weight:600;letter-spacing:.2px;color:var(--label2);text-transform:uppercase;margin-bottom:2px;font-family:var(--sans)}
.iconbtn{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--fill2);transition:transform .15s var(--ease);position:relative}
.iconbtn:active{transform:scale(.9)}
.iconbtn svg{width:17px;height:17px;fill:var(--label2)}
#sync-btn .dot{position:absolute;right:2px;bottom:2px;width:9px;height:9px;border-radius:99px;border:2px solid var(--bg)}
.savestate{font-size:11px;color:var(--label3);min-width:48px;text-align:right;margin-bottom:8px}
.savestate.err{color:var(--red)}
.searchbox{position:relative;margin-top:8px}
.searchbox svg{position:absolute;left:10px;top:10px;width:16px;height:16px;fill:var(--label2)}
.searchbox input{width:100%;background:var(--fill2);border:0;border-radius:10px;padding:8px 60px 8px 34px;font-size:16px}
.hits{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--yellow);color:#000;font-weight:700;font-size:11px;padding:2px 7px;border-radius:7px}
nav.tabs{display:flex;gap:2px;background:var(--fill2);border-radius:10px;padding:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1;padding:6px 10px;border-radius:8px;font-size:13.5px;color:var(--label2);font-weight:600;white-space:nowrap;transition:background .2s,color .2s}
nav.tabs button.on{background:var(--card);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--sheet);border:.5px solid var(--sep);border-radius:12px;box-shadow:var(--shadow);padding:5px;min-width:210px;z-index:50;max-height:min(64vh,560px);overflow-y:auto}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;font-size:15px;border-radius:8px}
.menu button:hover{background:var(--fill2)}

/* ————— capture ————— */
.capture{background:var(--card);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);margin:14px 0 12px}
.capture textarea{width:100%;resize:none;border:none;background:var(--fill2);border-radius:10px;padding:10px 11px;font-size:16px;min-height:56px;outline:none}
.capture textarea::placeholder{color:var(--label3)}
.caprow{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:9px}
.chip{background:var(--fill2);color:var(--label2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;border:1.5px solid transparent;transition:transform .15s var(--ease)}
.chip:active{transform:scale(.94)}
.chip.on{font-weight:700;color:var(--label);background:var(--card2);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.spacer{flex:1}
select.mini,.btn-mini{background:var(--fill2);border:0;border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:600;color:var(--label2)}
.btn-add{background:var(--blue);color:#fff;font-weight:600;border-radius:11px;padding:8px 18px;font-size:15px;transition:transform .15s var(--ease)}
.btn-add:active{transform:scale(.95)}
.cap-msg{font-size:12.5px;margin-top:8px;background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange);padding:7px 10px;border-radius:10px}

/* ————— cards ————— */
.card{position:relative;background:var(--card);border-radius:12px;padding:11px 11px 11px 14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%}
.card .bar{position:absolute;left:0;top:9px;bottom:9px;width:4px;border-radius:99px}
.card .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:11px;color:var(--label3);margin-bottom:3px}
.card .meta .t{font-weight:700}
.pchip{padding:1.5px 7px;border-radius:999px;font-weight:700}
.card h3{font-size:15px;font-weight:600;line-height:1.3;letter-spacing:-.1px}
.card .url{font-size:12.5px;color:var(--blue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .body{font-size:12.5px;color:var(--label2);margin-top:4px;white-space:pre-wrap;max-height:74px;overflow:hidden}
.card img{border-radius:8px;margin:4px 0;max-height:130px;object-fit:cover;width:100%}
.pin-ind{position:absolute;right:8px;top:6px;font-size:11px}
.tagbtn{color:var(--orange);font-weight:700}
.wikibtn{color:var(--blue);font-weight:700;text-decoration:underline dotted}
.wikibtn.dead{color:var(--label3);text-decoration:none}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
h2.sec{font-size:13px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--label2);margin-bottom:8px}
.hint{font-size:12.5px;color:var(--label3)}

/* ————— dashboard ————— */
.dash{display:flex;flex-direction:column;gap:20px}
.dash-top h1{font-family:var(--round);font-weight:800;font-size:24px;letter-spacing:-.4px}
.dash-top p{font-size:13px;color:var(--label2);margin-top:2px}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(105px,1fr))}
.tile{background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;box-shadow:var(--shadow);transition:transform .15s var(--ease)}
.tile:active{transform:scale(.96)}
.tile b{font-size:22px;font-weight:800;display:block;font-family:var(--round)}
.tile span{font-size:12px;color:var(--label2);font-weight:600}
.panel{background:var(--card);border-radius:var(--r);padding:13px;box-shadow:var(--shadow)}
.two-col{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.cloud{display:flex;flex-wrap:wrap;gap:6px}
.cloud button{background:color-mix(in srgb,var(--yellow) 22%,transparent);color:var(--label);font-weight:600;border-radius:999px;padding:3px 10px}
.proj-row{display:block;width:100%;text-align:left;margin-bottom:8px}
.proj-row .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
.track{height:6px;background:var(--fill2);border-radius:99px}
.fill{height:6px;border-radius:99px;transition:width .3s}
.link-quiet{color:var(--orange);font-weight:700}
.empty-hero{border:1.5px dashed var(--label3);border-radius:var(--r);padding:36px 20px;text-align:center}
.empty-hero p:first-child{font-family:var(--round);font-weight:800;font-size:20px}
.empty-hero p+p{font-size:14px;color:var(--label2);margin-top:6px}

/* ————— feed ————— */
.feed{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.dayline{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.daypill{font-size:11px;background:var(--fill);color:var(--label);font-weight:700;border-radius:999px;padding:3px 10px;text-transform:uppercase;letter-spacing:.3px}
.dayline .rule{flex:1;height:.5px;background:var(--sep)}
.frow{display:flex;gap:10px;background:var(--card);border-radius:12px;padding:11px;cursor:pointer;box-shadow:var(--shadow)}
.frow .ic{width:28px;height:28px;border-radius:14px;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.frow .fx{min-width:0;flex:1}
.frow .fm{display:flex;gap:8px;font-size:11px;color:var(--label3)}
.frow h3{font-size:15px;font-weight:600;letter-spacing:-.1px}
.frow .body{font-size:12.5px;color:var(--label2);white-space:pre-wrap}
.frow img{border-radius:8px;margin:4px 0;max-height:170px;object-fit:cover}
.pinbtn{align-self:flex-start;opacity:.35}
.pinbtn.on{opacity:1}

/* ————— kanban ————— */
.board{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));align-items:start}
.colu{background:var(--fill2);border-radius:var(--r);padding:8px;min-height:120px;transition:background .12s}
.colu.over{background:color-mix(in srgb,var(--blue) 16%,transparent)}
.colu .chead{display:flex;justify-content:space-between;align-items:baseline;padding:4px 8px 8px}
.colu .chead b{font-size:12.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--label2)}
.colu .chead span{font-size:12px;color:var(--label3);font-variant-numeric:tabular-nums}
.colu .stack{display:flex;flex-direction:column;gap:8px}

/* ————— projects ————— */
.psec h2{font-family:var(--round);font-size:17px;font-weight:700;letter-spacing:-.2px}
.psec .phead{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.btn-dash{border:1.5px dashed var(--label3);color:var(--label2);font-weight:600;border-radius:11px;padding:7px 14px;font-size:14px}
.newproj{display:inline-flex;align-items:center;gap:4px}
.newproj input{background:var(--fill2);border:0;border-radius:10px;padding:7px 10px;font-size:13px;width:150px;outline:2px solid var(--blue)}
.newproj .ok{background:var(--blue);color:#fff;font-weight:700;border-radius:10px;padding:7px 10px;font-size:12.5px}
.newproj .no{color:var(--label3);padding:7px 4px;font-size:12.5px}

/* ————— mind map ————— */
.maptools{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:12px;color:var(--label2);margin-bottom:8px}
.maptools .z{background:var(--fill2);border-radius:10px;padding:5px 11px;font-weight:600}
.mapbox{position:relative;overflow:hidden;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);height:min(68vh,640px);touch-action:none;cursor:grab}
.mapbox.linking{cursor:crosshair}
.plane{position:absolute;left:0;top:0;transform-origin:0 0}
.node{position:absolute;width:168px;background:var(--card2);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;cursor:pointer}
.node .nhead{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:800}
.node .connect{width:22px;height:22px;border-radius:11px;background:var(--fill2);color:var(--label);font-size:11px;line-height:1}
.node .connect.on{background:var(--yellow);color:#000}
.node h3{font-size:12.5px;font-weight:600;line-height:1.3;margin-top:2px;word-break:break-word}
.node .np{font-size:10px;font-weight:700;margin-top:3px}
.node img{border-radius:8px;margin:4px 0;max-height:80px;object-fit:cover;width:100%;pointer-events:none}
.map-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--label3);font-size:14px;text-align:center;padding:0 24px}

/* ————— the item sheet (was a centered modal) ————— */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.34)}
.modal{position:fixed;z-index:61;background:var(--sheet);left:0;right:0;bottom:0;width:100%;
  max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:0 16px calc(16px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 40px rgba(0,0,0,.22);animation:sheetup .32s var(--ease)}
@keyframes sheetup{from{transform:translateY(40px);opacity:.3}}
@media (min-width:640px){
  .modal{left:50%;right:auto;bottom:auto;top:8vh;width:min(600px,94vw);transform:translateX(-50%);
    border-radius:18px;max-height:84vh;animation:sheetin .3s var(--ease)}
  @keyframes sheetin{from{transform:translateX(-50%) translateY(10px);opacity:0}}
}
.mrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:5;
  background:var(--sheet);padding:14px 0 10px;margin-bottom:6px}
.lab{display:block;font-size:11px;font-weight:700;color:var(--label3);margin:0 0 4px;letter-spacing:.04em}
.field{width:100%;background:var(--fill2);border:0;border-radius:10px;padding:9px 12px;font-size:16px;margin-bottom:12px;outline:none}
textarea.field{resize:vertical;min-height:100px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cchip{background:var(--fill2);border-radius:999px;padding:4px 10px;font-size:12.5px;display:inline-flex;gap:5px;align-items:center}
.cchip .x{color:var(--label3)}
.wchip{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);font-weight:700;border-radius:999px;padding:4px 10px;font-size:12.5px}
.bchip{background:var(--fill2);border:1px dashed var(--label3);font-weight:600;border-radius:999px;padding:4px 10px;font-size:12.5px}
.tchip{background:color-mix(in srgb,var(--yellow) 22%,transparent);color:var(--label);font-weight:700;border-radius:999px;padding:3px 10px;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.danger{color:var(--red);font-weight:600;font-size:15px;padding:8px 12px;border-radius:10px}
.danger.armed{background:var(--red);color:#fff;font-weight:700}
.btn-done{background:var(--blue);color:#fff;font-weight:600;border-radius:11px;padding:8px 18px;font-size:15px}
.mfoot{display:flex;justify-content:space-between;align-items:center;border-top:.5px solid var(--sep);padding-top:12px;margin-top:6px}
.openlink{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);font-weight:700;border-radius:10px;padding:9px 12px;font-size:13.5px;text-decoration:none;white-space:nowrap;margin-bottom:12px}
.banner{font-size:13px;background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);padding:8px 12px;border-radius:10px;margin-bottom:12px}
main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}

/* ————— the shared bottom tab bar, same as the main app ————— */
#tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--elev);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)}
#tabbar .tabs2{display:flex}
.tab{flex:1;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--label3);text-decoration:none}
.tab svg{width:24px;height:24px;fill:currentColor}
.tab span{font-size:9.5px;font-weight:600}
.tab.on{color:var(--blue)}
@media (max-width:860px){
  #tabbar{display:block}
  /* The mind map is a desktop view: panning a 4000px plane and threading nodes
     wants a big pointer surface, not a thumb on 390px. Connections still happen
     on the phone — [[wiki links]] and the sheet's "Connect to another idea" —
     only the picture of them waits for a desktop. Hides the nudge that points
     at the map, too, since both carry data-view="map". */
  [data-view="map"]{display:none}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hrow">
      <a class="backship" href="index.html" title="Back to Shipshape" aria-label="Back to Shipshape"><img src="favicon.svg" alt=""></a>
      <h1 class="bh"><span class="sub">Everything</span>Board</h1>
      <span class="savestate" id="savestate"></span>
      <button class="iconbtn" id="sync-btn" aria-label="Sync"><svg viewBox="0 0 24 24"><path d="M6.5 19A5.5 5.5 0 0 1 5.7 8.06a6.5 6.5 0 0 1 12.34 1.6A4.5 4.5 0 0 1 17.5 19h-11Z"/></svg><span class="dot" style="background:#B8C4CD"></span></button>
      <div class="menu-wrap">
        <button class="iconbtn" id="menu-btn" aria-label="More"><svg viewBox="0 0 20 20"><circle cx="4" cy="10" r="1.8"/><circle cx="10" cy="10" r="1.8"/><circle cx="16" cy="10" r="1.8"/></svg></button>
        <div class="menu" id="menu" hidden>
          <button id="m-export">Save a backup file</button>
          <button id="m-import">Load from a backup file</button>
          <button id="m-erase" style="color:var(--red)">Erase all data</button>
        </div>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </div>
    <div class="searchbox">
      <svg viewBox="0 0 20 20"><path d="M8.5 2a6.5 6.5 0 1 0 4.03 11.6l3.94 3.93a1 1 0 0 0 1.41-1.41l-3.93-3.94A6.5 6.5 0 0 0 8.5 2Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/></svg>
      <input id="search" type="search" placeholder="Search everything — words, #tags, links…" autocomplete="off">
      <button class="hits" id="hits" hidden></button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="home">Home</button>
      <button data-view="feed">Feed</button>
      <button data-view="board">Board</button>
      <button data-view="projects">Projects</button>
      <button data-view="map">Mind map</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <section class="capture">
    <textarea id="cap-text" rows="2" placeholder="Throw anything in — thoughts, links, pasted emails. Use #tags and [[other idea]] to connect. (Ctrl/⌘+Enter)"></textarea>
    <div class="caprow" id="cap-types"></div>
    <div class="cap-msg" id="cap-msg" hidden></div>
  </section>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="sync-root"></div>

<script>
"use strict";
/* ————— Everything Board · standalone ————— */

/* iOS palette, as constant hexes: the code builds `${color}22` alpha variants,
   which a var() reference cannot survive. The dark-scheme values read well on
   both themes. */
const TYPE_META = {
  note:    { label: "Note",    color: "#FF9F0A", icon: "✎" },
  link:    { label: "Link",    color: "#0A84FF", icon: "⌘" },
  image:   { label: "Image",   color: "#BF5AF2", icon: "▣" },
  email:   { label: "Email",   color: "#64D2FF", icon: "✉" },
  thought: { label: "Thought", color: "#FF375F", icon: "◌" },
};
const STATUSES = [
  { id: "inbox", label: "Inbox" },
  { id: "todo",  label: "To do" },
  { id: "doing", label: "In progress" },
  { id: "done",  label: "Done" },
];
const PROJECT_COLORS = ["#0A84FF","#BF5AF2","#FF375F","#FF9F0A","#64D2FF","#30D158","#5E5CE6","#FFD60A"];
const KEY = "everything-board:v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ————— storage (localStorage with in-memory fallback) ————— */
let memoryOnly = false, memoryStore = null;
function normalize(d) {
  d.items = Array.isArray(d.items) ? d.items : [];
  d.projects = Array.isArray(d.projects) ? d.projects : [];
  d.tombstones = d.tombstones && typeof d.tombstones === "object" ? d.tombstones : {};
  return d;
}
function loadData() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.items)) return normalize(d); }
  } catch (e) { memoryOnly = true; }
  return normalize({});
}
let saveTimer = null;
function persist() {
  setSave("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      if (memoryOnly) { memoryStore = JSON.stringify(state); setSave("saved"); schedulePush(); return; }
      localStorage.setItem(KEY, JSON.stringify(state));
      setSave("saved");
    } catch (e) { setSave("err"); }
    schedulePush();
  }, 350);
}
/* The debounce above means a capture followed within 350ms by a navigation — a
   tap on "Open in Shipshape", a tab close — would silently lose the write. The
   page going away flushes it synchronously. */
function persistNow() {
  clearTimeout(saveTimer);
  try {
    if (memoryOnly) memoryStore = JSON.stringify(state);
    else localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {}
}
addEventListener("pagehide", persistNow);
document.addEventListener("visibilitychange", () => { if (document.hidden) persistNow(); });
function setSave(s) {
  const el = document.getElementById("savestate");
  el.className = "savestate" + (s === "err" ? " err" : "");
  el.textContent = s === "saving" ? "Saving…" : s === "saved" ? "Saved ✓" : s === "err" ? "Save failed" : "";
  if (s === "saved") setTimeout(() => { if (el.textContent === "Saved ✓") el.textContent = ""; }, 1500);
}

/* ————— app state ————— */
let state = loadData();
let view = "home";
let query = "";
let openId = null;
let connectFrom = null;
let mapPan = null, mapZoom = 1;
const W = 4000, H = 3000;

/* ————— helpers ————— */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const isUrl = (s) => /^https?:\/\/\S+$/i.test((s || "").trim());
const isImageUrl = (s) => /\.(png|jpe?g|gif|webp|svg|avif)(\?.*)?$/i.test((s || "").trim());
const looksLikeEmail = (s) => /^(from|to|subject|fwd|re):/i.test((s || "").trim()) || /^-{2,}\s*forwarded/i.test((s || "").trim());
function detectType(t) {
  t = (t || "").trim();
  if (!t) return "note";
  if (isUrl(t)) return isImageUrl(t) ? "image" : "link";
  if (looksLikeEmail(t)) return "email";
  return "note";
}
const extractTags = (i) => [...new Set(((i.title||"")+" "+(i.content||"")).match(/#[\p{L}\d_-]+/gu) || [])];
const wikiRefs = (i) => ((i.content||"").match(/\[\[([^\]]+)\]\]/g) || []).map(m => m.slice(2,-2).trim().toLowerCase());
const itemName = (i) => i.title || i.url || (i.content||"").slice(0,40) || "Untitled";
const byId = (id) => state.items.find(i => i.id === id);
/* ————— Shipshape projects, linkable —————
   A card can belong to a real job from the main app: its projectId is stored as
   "ss:<shipshape id>", and the job itself is read from Shipshape's saved data on
   this device — never copied into the board, so there is exactly one owner of a
   job's name and colour. On another device the reference resolves as soon as
   Shipshape itself has synced there. Board-native projects ("kitchen reno
   ideas") work exactly as before, side by side. */
const SS_COLORS = { "var(--blue)":"#0A84FF","var(--purple)":"#BF5AF2","var(--pink)":"#FF375F",
  "var(--orange)":"#FF9F0A","var(--teal)":"#64D2FF","var(--green)":"#30D158",
  "var(--indigo)":"#5E5CE6","var(--yellow)":"#FFD60A","var(--red)":"#FF453A","var(--gray)":"#98989D" };
let ssProjCache = { raw: null, list: [] };
function ssProjects() {
  let raw = null;
  try { raw = localStorage.getItem("shipshape:v3"); } catch (e) {}
  if (raw === ssProjCache.raw) return ssProjCache.list;
  let list = [];
  try {
    const d = JSON.parse(raw || "{}");
    list = (Array.isArray(d.projects) ? d.projects : []).map(p => ({
      id: "ss:" + p.id, ssId: p.id, name: p.name || "Untitled job",
      color: SS_COLORS[p.color] || (/^#/.test(p.color || "") ? p.color : "#98989D"), ss: true }));
  } catch (e) {}
  ssProjCache = { raw, list };
  return list;
}
const proj = (id) => (typeof id === "string" && id.startsWith("ss:"))
  ? ssProjects().find(p => p.id === id)
  : state.projects.find(p => p.id === id);
/* one option list everywhere a project is picked: jobs first, then board projects */
function projectOptionsHtml(sel) {
  const jobs = ssProjects();
  return `<option value=""${!sel ? " selected" : ""}>No project</option>`
    + (jobs.length ? `<optgroup label="Jobs — from Shipshape">${jobs.map(p =>
        `<option value="${p.id}"${sel === p.id ? " selected" : ""}>${esc(p.name)}</option>`).join("")}</optgroup>` : "")
    + (state.projects.length ? `<optgroup label="Board projects">${state.projects.map(p =>
        `<option value="${p.id}"${sel === p.id ? " selected" : ""}>${esc(p.name)}</option>`).join("")}</optgroup>` : "")
    + `<option value="__new">＋ New board project…</option>`;
}
const itemImg = (i) => i.imageData || (i.type === "image" && i.url ? i.url : null);

function getEdges(items) {
  const byTitle = new Map(items.filter(i => i.title).map(i => [i.title.trim().toLowerCase(), i]));
  const edges = [], seen = new Set();
  const push = (a, b, kind) => {
    if (!a || !b || a.id === b.id) return;
    const k = [a.id, b.id].sort().join("|");
    if (seen.has(k)) return;
    seen.add(k); edges.push({ a, b, kind });
  };
  items.forEach(it => (it.links||[]).forEach(id => push(it, items.find(x => x.id === id), "manual")));
  items.forEach(it => wikiRefs(it).forEach(t => push(it, byTitle.get(t), "wiki")));
  return edges;
}

function matches(i, q) {
  if (!q) return true;
  const p = proj(i.projectId);
  const st = STATUSES.find(s => s.id === i.status);
  const hay = [i.title, i.content, i.url, i.type, p && p.name, st && st.label, extractTags(i).join(" ")]
    .filter(Boolean).join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
const visibleItems = () => state.items.filter(i => matches(i, query));

/* highlight + rich text (all output is escaped) */
function markHtml(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  const words = q.toLowerCase().split(/\s+/).filter(Boolean).map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!words.length) return safe;
  return safe.replace(new RegExp("(" + words.join("|") + ")", "ig"), "<mark>$1</mark>");
}
function richHtml(text, q) {
  if (!text) return "";
  return String(text).split(/(#[\p{L}\d_-]+|\[\[[^\]]+\]\])/gu).map(part => {
    if (/^#[\p{L}\d_-]+$/u.test(part))
      return `<button class="tagbtn" data-act="tag" data-tag="${esc(part)}">${esc(part)}</button>`;
    const wm = part.match(/^\[\[([^\]]+)\]\]$/);
    if (wm) {
      const name = wm[1].trim();
      const t = state.items.find(x => (x.title||"").trim().toLowerCase() === name.toLowerCase());
      return t
        ? `<button class="wikibtn" data-act="open" data-id="${t.id}">${esc(name)}</button>`
        : `<span class="wikibtn dead">${esc(name)}</span>`;
    }
    return markHtml(part, q);
  }).join("");
}

/* ————— mutations ————— */
function addItem(partial) {
  state.items.unshift(Object.assign({
    id: uid(), type: "note", title: "", content: "", url: "", imageData: "",
    projectId: null, status: "inbox", createdAt: Date.now(), updatedAt: Date.now(), pinned: false,
    links: [], x: null, y: null,
  }, partial));
  persist(); renderMain();
}
function patchItem(id, patch, rerender = true) {
  const it = byId(id);
  if (!it) return;
  Object.assign(it, patch, { updatedAt: Date.now() });
  persist();
  if (rerender) renderMain();
}
function deleteItem(id) {
  state.items = state.items.filter(i => i.id !== id);
  state.items.forEach(i => i.links = (i.links||[]).filter(l => l !== id));
  state.tombstones[id] = Date.now();
  persist(); renderMain();
}
function toggleLink(a, b) {
  const ia = byId(a), ib = byId(b);
  if (!ia || !ib || a === b) return;
  ia.links = ia.links || []; ib.links = ib.links || [];
  if (ia.links.includes(b) || ib.links.includes(a)) {
    ia.links = ia.links.filter(x => x !== b);
    ib.links = ib.links.filter(x => x !== a);
  } else ia.links.push(b);
  ia.updatedAt = Date.now(); ib.updatedAt = Date.now();
  persist(); renderMain();
}
function addProject(name) {
  const id = uid();
  state.projects.push({ id, name, color: PROJECT_COLORS[state.projects.length % PROJECT_COLORS.length], updatedAt: Date.now() });
  persist();
  return id;
}
function goTag(tag) {
  query = tag;
  document.getElementById("search").value = tag;
  setView("feed");
}
function setView(v) {
  view = v; connectFrom = null;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  renderMain();
}

/* ————— shared card html ————— */
function projChip(i) {
  const p = proj(i.projectId);
  return p ? `<span class="pchip" style="background:${p.color}1E;color:${p.color}">${esc(p.name)}</span>` : "";
}
function cardHtml(i, { draggable = false } = {}) {
  const m = TYPE_META[i.type] || TYPE_META.note;
  const img = itemImg(i);
  const nLinks = (i.links||[]).length + wikiRefs(i).length;
  const body = i.content && i.content !== i.title
    ? `<div class="body">${richHtml(i.content.length > 220 ? i.content.slice(0,220) + "…" : i.content, query)}</div>` : "";
  return `<div class="card card-enter" role="button" tabindex="0" data-act="open" data-id="${i.id}" ${draggable ? 'draggable="true"' : ""}>
    <span class="bar" style="background:${m.color}"></span>
    ${i.pinned ? '<span class="pin-ind" title="Pinned">📌</span>' : ""}
    <div class="meta"><span class="t" style="color:${m.color}">${m.icon} ${m.label}</span>${projChip(i)}${nLinks ? `<span>⟡ ${nLinks}</span>` : ""}</div>
    ${img ? `<img src="${esc(img)}" alt="">` : ""}
    ${i.title ? `<h3>${markHtml(i.title, query)}</h3>` : ""}
    ${i.url && !img ? `<div class="url">${markHtml(i.url, query)}</div>` : ""}
    ${body}
  </div>`;
}

/* ————— views ————— */
function renderMain() {
  const main = document.getElementById("main");
  const hits = document.getElementById("hits");
  const vis = visibleItems();
  hits.hidden = !query;
  if (query) hits.textContent = `${vis.length} hit${vis.length === 1 ? "" : "s"} ✕`;
  if (memoryOnly && !document.getElementById("mem-banner")) {
    main.insertAdjacentHTML("beforebegin",
      `<p class="banner" id="mem-banner">This browser is blocking local storage (private mode?). Your data will vanish when you close the tab — use Download backup to keep it.</p>`);
  }
  if (view === "home") main.innerHTML = homeHtml();
  else if (view === "feed") main.innerHTML = feedHtml(vis);
  else if (view === "board") main.innerHTML = boardHtml(vis);
  else if (view === "projects") main.innerHTML = projectsHtml(vis);
  else if (view === "map") { main.innerHTML = mapHtml(); mountMap(); }
}

function homeHtml() {
  const all = state.items;
  if (!all.length)
    return `<div class="empty-hero dotgrid">
      <p>Your brain, one box up ↑</p>
      <p>Type anything into the capture bar. Add <b>#tags</b> to group ideas and <b>[[Idea title]]</b> to link one idea to another — the mind map draws the threads for you.</p>
    </div>`;
  const edges = getEdges(all);
  const connected = new Set(edges.flatMap(e => [e.a.id, e.b.id]));
  const orphans = all.filter(i => !connected.has(i.id)).length;
  const pinned = all.filter(i => i.pinned);
  const recent = [...all].sort((a,b) => b.createdAt - a.createdAt).slice(0, 6);
  const tagCounts = {};
  all.forEach(i => extractTags(i).forEach(t => tagCounts[t] = (tagCounts[t]||0) + 1));
  const tags = Object.entries(tagCounts).sort((a,b) => b[1]-a[1]).slice(0, 18);
  const h = new Date().getHours();
  const greet = h < 5 ? "Late-night brain, welcome" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";

  return `<div class="dash">
    <div class="dash-top">
      <h1>${greet}.</h1>
      <p>${all.length} idea${all.length===1?"":"s"} · ${edges.length} connection${edges.length===1?"":"s"} · ${state.projects.length + ssProjects().filter(p => all.some(i => i.projectId === p.id)).length} project${(state.projects.length + ssProjects().filter(p => all.some(i => i.projectId === p.id)).length)===1?"":"s"}${
        orphans ? ` · <button class="link-quiet" data-act="view" data-view="map">${orphans} floating free ⟶ connect them</button>` : ""}</p>
    </div>
    <div class="tiles">${Object.entries(TYPE_META).map(([t,m]) => {
      const n = all.filter(i => i.type === t).length;
      return `<button class="tile" style="border-top:3px solid ${m.color}" data-act="tag" data-tag="${t}"><b>${n}</b><span>${m.icon} ${m.label}s</span></button>`;
    }).join("")}</div>
    <section>
      <h2 class="sec">📌 Pinned</h2>
      ${pinned.length ? `<div class="grid">${pinned.map(i => cardHtml(i)).join("")}</div>`
        : `<p class="hint">Open any idea and hit the pin to keep it on your dashboard.</p>`}
    </section>
    <div class="two-col">
      <section class="panel">
        <h2 class="sec"># Tags</h2>
        ${tags.length ? `<div class="cloud">${tags.map(([t,n]) =>
            `<button data-act="tag" data-tag="${esc(t)}" style="font-size:${11 + Math.min(4,n)}px">${esc(t)} <span style="opacity:.6">${n}</span></button>`).join("")}</div>`
          : `<p class="hint">Type #anything inside an idea and it becomes a tag here.</p>`}
      </section>
      <section class="panel">
        <h2 class="sec">Projects</h2>
        ${(ssProjects().filter(p => all.some(i => i.projectId === p.id)).concat(state.projects)).length
          ? ssProjects().filter(p => all.some(i => i.projectId === p.id)).concat(state.projects).map(p => {
            const list = all.filter(i => i.projectId === p.id);
            const done = list.filter(i => i.status === "done").length;
            const pct = list.length ? Math.round(done/list.length*100) : 0;
            return `<button class="proj-row" data-act="view" data-view="projects">
              <span class="top"><span style="color:${p.color};font-weight:700">● ${esc(p.name)}</span><span style="color:var(--label3)">${done}/${list.length} done</span></span>
              <span class="track" style="display:block"><span class="fill" style="display:block;width:${pct}%;background:${p.color}"></span></span>
            </button>`;
          }).join("")
          : `<p class="hint">No projects yet — create one from the capture bar, or pick one of your Shipshape jobs there.</p>`}
      </section>
    </div>
    <section>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h2 class="sec" style="margin:0">Recently captured</h2>
        <button style="color:var(--blue);font-weight:700;font-size:12px" data-act="view" data-view="feed">Full feed →</button>
      </div>
      <div class="grid">${recent.map(i => cardHtml(i)).join("")}</div>
    </section>
  </div>`;
}

function feedHtml(list) {
  const sorted = [...list].sort((a,b) => b.createdAt - a.createdAt);
  if (!sorted.length)
    return `<p class="hint" style="text-align:center;padding:36px 0">${query ? "No matches — try fewer words." : "Nothing captured yet. The feed fills newest-first as you add ideas."}</p>`;
  const groups = [];
  sorted.forEach(i => {
    const day = new Date(i.createdAt).toDateString();
    const g = groups[groups.length-1];
    if (g && g.day === day) g.list.push(i); else groups.push({ day, list: [i] });
  });
  const today = new Date().toDateString(), yest = new Date(Date.now()-864e5).toDateString();
  const label = d => d === today ? "Today" : d === yest ? "Yesterday"
    : new Date(d).toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
  return `<div class="feed">${groups.map(g => `
    <section>
      <div class="dayline"><span class="daypill">${label(g.day)}</span><span class="rule"></span></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${g.list.map(i => {
          const m = TYPE_META[i.type] || TYPE_META.note;
          const img = itemImg(i);
          return `<div class="frow card-enter" role="button" tabindex="0" data-act="open" data-id="${i.id}">
            <div class="ic" style="background:${m.color}22;color:${m.color}">${m.icon}</div>
            <div class="fx">
              <div class="fm"><span>${new Date(i.createdAt).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</span>${
                proj(i.projectId) ? `<span style="color:${proj(i.projectId).color};font-weight:700">● ${esc(proj(i.projectId).name)}</span>` : ""}${i.pinned ? "<span>📌</span>" : ""}</div>
              ${i.title ? `<h3>${markHtml(i.title, query)}</h3>` : ""}
              ${i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noreferrer" data-act="noop" style="font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${markHtml(i.url, query)}</a>` : ""}
              ${img ? `<img src="${esc(img)}" alt="">` : ""}
              ${i.content && i.content !== i.title ? `<div class="body">${richHtml(i.content.length > 400 ? i.content.slice(0,400)+"…" : i.content, query)}</div>` : ""}
            </div>
            <button class="pinbtn${i.pinned ? " on" : ""}" data-act="pin" data-id="${i.id}" title="${i.pinned ? "Unpin" : "Pin to dashboard"}">📌</button>
          </div>`;
        }).join("")}
      </div>
    </section>`).join("")}</div>`;
}

function boardHtml(list) {
  return `<div class="board">${STATUSES.map(s => {
    const col = list.filter(i => (i.status || "inbox") === s.id);
    return `<div class="colu" data-status="${s.id}">
      <div class="chead"><b>${s.label}</b><span>${col.length}</span></div>
      <div class="stack">
        ${col.map(i => cardHtml(i, { draggable: true })).join("")}
        ${col.length ? "" : `<p class="hint" style="text-align:center;padding:16px 0">Drag cards here</p>`}
      </div>
    </div>`;
  }).join("")}</div>`;
}

function projectsHtml(list) {
  /* jobs first (only the ones that actually hold cards — the pickers list them
     all, so an empty job earns no section), then board projects, then the rest */
  const groups = ssProjects().map(p => ({ p, list: list.filter(i => i.projectId === p.id) }))
    .filter(g => g.list.length);
  groups.push(...state.projects.map(p => ({ p, list: list.filter(i => i.projectId === p.id) })));
  groups.push({ p: null, list: list.filter(i => !i.projectId || !proj(i.projectId)) });
  return `<div style="display:flex;flex-direction:column;gap:20px">
    <div id="np-slot"><button class="btn-dash" data-act="np-open">＋ New project</button></div>
    ${groups.map(({ p, list: pl }) => `
      <section class="psec" id="sec-${p ? p.id : "none"}">
        <div class="phead">
          <span class="sw" style="background:${p ? p.color : "#B8C4CD"}"></span>
          <h2>${p ? esc(p.name) : "Not in a project"}</h2>
          <span class="hint">${pl.length}</span>
          ${p && p.ss ? `<a class="hint" style="color:var(--blue);font-weight:700;text-decoration:none" href="index.html#project=${esc(p.ssId)}">Open in Shipshape →</a>` : ""}
          ${p && !p.ss ? `<button class="hint" data-act="del-proj" data-id="${p.id}" data-armed="0" style="padding:2px 6px;border-radius:6px">✕</button>` : ""}
        </div>
        ${pl.length ? `<div class="grid">${pl.map(i => cardHtml(i)).join("")}</div>`
          : `<p class="hint">Nothing here yet — assign items from a card, or pick this project when capturing.</p>`}
      </section>`).join("")}
  </div>`;
}

/* ————— mind map ————— */
function ensurePlaced() {
  let k = state.items.filter(i => i.x != null && i.y != null).length;
  let changed = false;
  state.items.forEach(i => {
    if (i.x == null || i.y == null) {
      const angle = k * 2.4, r = 90 + 34 * Math.sqrt(k);
      i.x = W/2 + r * Math.cos(angle);
      i.y = H/2 + r * Math.sin(angle);
      k++; changed = true;
    }
  });
  if (changed) persist();
}
function mapHtml() {
  return `
  <div class="maptools">
    <span id="map-hint" style="font-weight:600">Drag ideas · drag canvas to pan · tap ⟡ then another node to thread them. Solid blue threads come from [[wiki links]] in your text.</span>
    <span class="spacer"></span>
    <button class="z" data-act="zoom" data-d="1">＋</button>
    <button class="z" data-act="zoom" data-d="-1">－</button>
    <button class="z" data-act="center">Center</button>
  </div>
  <div class="mapbox dotgrid" id="mapbox">
    <div class="plane" id="plane" style="width:${W}px;height:${H}px">
      <svg id="edges" width="${W}" height="${H}" style="position:absolute;inset:0;pointer-events:none"></svg>
      <div id="nodes"></div>
    </div>
    ${state.items.length ? "" : `<div class="map-empty">Capture a few ideas above and they'll appear here as a constellation.</div>`}
  </div>`;
}
function mountMap() {
  ensurePlaced();
  if (!mapPan) mapPan = { x: -W/2 + 200, y: -H/2 + 200 };
  const box = document.getElementById("mapbox");
  renderMapContents();
  applyPan();

  let drag = null, justDragged = false;
  box.addEventListener("pointerdown", (e) => {
    const nodeEl = e.target.closest(".node");
    if (e.target.closest(".connect")) return;
    if (nodeEl) {
      const it = byId(nodeEl.dataset.id);
      drag = { mode: "node", id: it.id, sx: e.clientX, sy: e.clientY, ox: it.x, oy: it.y, moved: false, el: nodeEl };
    } else {
      drag = { mode: "pan", sx: e.clientX, sy: e.clientY, ox: mapPan.x, oy: mapPan.y, moved: false };
    }
    box.setPointerCapture(e.pointerId);
  });
  box.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    if (drag.mode === "pan") { mapPan = { x: drag.ox + dx, y: drag.oy + dy }; applyPan(); }
    else {
      const it = byId(drag.id);
      it.x = drag.ox + dx / mapZoom; it.y = drag.oy + dy / mapZoom;
      drag.el.style.left = it.x + "px"; drag.el.style.top = it.y + "px";
      drawEdges();
    }
  });
  /* Taps on nodes are decided here, in pointerup, not in a click listener: the
     pointerdown captures the pointer to the box for dragging, and with capture
     held Chrome retargets the eventual click at the box itself — so a click
     handler never sees which node was tapped, and "tap a node to open it" and
     "tap the second node to thread it" silently did nothing. The ⟡ button is
     the one exception: its pointerdown returns before capture, so its click
     arrives normally and is handled in the click listener below. */
  const tapNode = (id) => {
    if (connectFrom && connectFrom !== id) { const from = connectFrom; connectFrom = null; toggleLink(from, id); return; }
    if (connectFrom === id) { connectFrom = null; renderMapContents(); return; }
    openModal(id);
  };
  box.addEventListener("pointerup", () => {
    if (drag && drag.mode === "node" && drag.moved) persist();
    if (drag && !drag.moved) {
      if (drag.mode === "node") tapNode(drag.id);
      else if (connectFrom) { connectFrom = null; renderMapContents(); }
    }
    justDragged = !!(drag && drag.moved);
    drag = null;
  });
  box.addEventListener("click", (e) => {
    if (justDragged) { justDragged = false; return; }
    const cbtn = e.target.closest(".connect");
    if (!cbtn) return;         // node taps were already handled in pointerup
    const id = cbtn.closest(".node").dataset.id;
    connectFrom = connectFrom === id ? null : id;
    renderMapContents();
  });
}
function applyPan() {
  const plane = document.getElementById("plane");
  if (plane) plane.style.transform = `translate(${mapPan.x}px, ${mapPan.y}px) scale(${mapZoom})`;
  const box = document.getElementById("mapbox");
  if (box) box.classList.toggle("linking", !!connectFrom);
  const hint = document.getElementById("map-hint");
  if (hint) hint.textContent = connectFrom
    ? "Now tap another idea to connect — tap again to unlink. Tap the canvas to cancel."
    : "Drag ideas · drag canvas to pan · tap ⟡ then another node to thread them. Solid blue threads come from [[wiki links]] in your text.";
}
function renderMapContents() {
  const nodes = document.getElementById("nodes");
  if (!nodes) return;
  const visSet = new Set(visibleItems().map(i => i.id));
  nodes.innerHTML = state.items.map(i => {
    const m = TYPE_META[i.type] || TYPE_META.note;
    const p = proj(i.projectId);
    const hit = visSet.has(i.id), dim = query && !hit, glow = query && hit;
    const linking = connectFrom === i.id;
    const img = itemImg(i);
    const border = linking ? "var(--label)" : glow ? "var(--yellow)" : m.color;
    const shadow = glow ? "0 0 0 4px color-mix(in srgb,var(--yellow) 45%,transparent), var(--shadow)" : "var(--shadow)";
    return `<div class="node" data-id="${i.id}" style="left:${i.x}px;top:${i.y}px;transform:translate(-50%,-50%);border:2px solid ${border};box-shadow:${shadow};opacity:${dim ? .35 : 1}">
      <div class="nhead" style="color:${m.color}">
        <span>${m.icon} ${m.label.toUpperCase()}</span>
        <button class="connect${linking ? " on" : ""}" title="Connect this idea">⟡</button>
      </div>
      ${img ? `<img src="${esc(img)}" alt="" draggable="false">` : ""}
      <h3>${markHtml(itemName(i), query)}</h3>
      ${p ? `<div class="np" style="color:${p.color}">● ${esc(p.name)}</div>` : ""}
    </div>`;
  }).join("");
  applyPan();
  drawEdges();
}
function drawEdges() {
  const svg = document.getElementById("edges");
  if (!svg) return;
  const visSet = new Set(visibleItems().map(i => i.id));
  const placed = state.items.filter(i => i.x != null && i.y != null);
  svg.innerHTML = getEdges(placed).map(({ a, b, kind }) => {
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    const dx = b.x-a.x, dy = b.y-a.y, len = Math.hypot(dx,dy) || 1;
    const cx = mx - (dy/len) * Math.min(60, len*.18);
    const cy = my + (dx/len) * Math.min(60, len*.18);
    const dim = query && !(visSet.has(a.id) && visSet.has(b.id));
    const wiki = kind === "wiki";
    return `<path d="M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}" fill="none"
      style="stroke:${dim ? "var(--sep)" : wiki ? "var(--blue)" : "var(--label3)"}" stroke-width="2"
      ${wiki ? "" : 'stroke-dasharray="1 7"'} stroke-linecap="round" opacity="${wiki && !dim ? .85 : 1}"/>`;
  }).join("");
}

/* ————— capture bar ————— */
let capType = null, capProject = "";
function renderCaptureRow() {
  const row = document.getElementById("cap-types");
  const text = document.getElementById("cap-text").value;
  const eff = capType || detectType(text);
  row.innerHTML = Object.entries(TYPE_META).map(([id, m]) => {
    const on = eff === id;
    return `<button class="chip${on ? " on" : ""}" data-cap-type="${id}"
      style="${on ? `border-color:${m.color};background:${m.color}22` : ""}">
      <span style="color:${m.color}">${m.icon}</span> ${m.label}${on && !capType ? " · auto" : ""}</button>`;
  }).join("")
  + `<span class="spacer"></span>
     <span id="cap-proj-slot">${capProjectSelect()}</span>
     <button class="btn-mini" id="cap-img-btn">▣ Add image</button>
     <input type="file" id="cap-file" accept="image/*" hidden>
     <button class="btn-add" id="cap-add">Add it</button>`;
}
function capProjectSelect() {
  return `<select class="mini" id="cap-proj">${projectOptionsHtml(capProject)}</select>`;
}
function newProjectInline(onCreate, onCancel) {
  const span = document.createElement("span");
  span.className = "newproj";
  span.innerHTML = `<input type="text" placeholder="Project name"><button class="ok">✓</button><button class="no">✕</button>`;
  const inp = span.querySelector("input");
  span.querySelector(".ok").addEventListener("click", () => inp.value.trim() && onCreate(inp.value.trim()));
  span.querySelector(".no").addEventListener("click", onCancel);
  inp.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && inp.value.trim()) onCreate(inp.value.trim());
    if (e.key === "Escape") onCancel();
  });
  setTimeout(() => inp.focus(), 0);
  return span;
}
function capSubmit(extra = {}) {
  const ta = document.getElementById("cap-text");
  const t = ta.value.trim();
  if (!t && !extra.imageData) return;
  const first = t.split("\n")[0].slice(0, 90);
  addItem(Object.assign({
    type: extra.imageData ? "image" : (capType || detectType(t)),
    title: isUrl(first) ? "" : first,
    content: isUrl(t) ? "" : t,
    url: isUrl(first) ? first : "",
    projectId: capProject || null,
  }, extra));
  ta.value = ""; capType = null;
  renderCaptureRow();
}
function capMsg(m) {
  const el = document.getElementById("cap-msg");
  el.hidden = !m; el.textContent = m || "";
}

function closeModal() { openId = null; document.getElementById("modal-root").innerHTML = ""; renderMain(); }

  const m = TYPE_META[i.type] || TYPE_META.note;

  const manual = state.items.filter(x => (i.links||[]).includes(x.id) || (x.links||[]).includes(i.id));
  const myTitle = (i.title||"").trim().toLowerCase();
  const outgoing = wikiRefs(i).map(t => state.items.find(x => (x.title||"").trim().toLowerCase() === t)).filter(Boolean);
  const backlinks = state.items.filter(x => x.id !== i.id && myTitle && wikiRefs(x).includes(myTitle));
  const connectable = state.items.filter(x => x.id !== i.id && !manual.some(c => c.id === x.id));

        <span class="spacer"></span>
        <span class="hint">${new Date(i.createdAt).toLocaleDateString()}</span>
        <button class="btn-mini" id="md-close" aria-label="Close">✕</button>
      </div>
      ${img ? `<img src="${esc(img)}" alt="" style="border-radius:12px;margin-bottom:12px;max-height:260px;object-fit:contain;background:var(--bg);width:100%">` : ""}
      <label class="lab" for="md-title">TITLE</label>
      <input class="field" id="md-title" value="${esc(i.title)}" placeholder="Give it a name — other ideas can [[link]] to it by this title">
      <label class="lab" for="md-url">LINK / URL</label>
      <div style="display:flex;gap:8px">
        <input class="field" id="md-url" style="flex:1;color:var(--blue)" value="${esc(i.url)}" placeholder="https://…">
        ${i.url ? `<a class="openlink" href="${esc(i.url)}" target="_blank" rel="noreferrer">Open ↗</a>` : ""}
      </div>
      <label class="lab" for="md-content">CONTENT — supports #tags and [[Idea title]] links</label>
      <textarea class="field" id="md-content" rows="5" placeholder="Notes, pasted email, the thought itself…">${esc(i.content)}</textarea>
      ${tags.length ? `<div class="chips">${tags.map(t =>
        `<button class="tchip" data-act="tag" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}</div>` : ""}
      <div class="grid2" style="margin-bottom:12px">
        <div>
          <span class="lab">PROJECT</span>
          <span id="md-proj-slot"><select class="field" id="md-proj" style="margin:0">${projectOptionsHtml(i.projectId)}</select></span>
        </div>
        <div>
          <span class="lab">STATUS</span>
          <select class="field" id="md-status" style="margin:0">
            ${STATUSES.map(s => `<option value="${s.id}"${(i.status||"inbox") === s.id ? " selected" : ""}>${s.label}</option>`).join("")}
          </select>
        </div>
      </div>
      <span class="lab">CONNECTED IDEAS</span>
      <div class="chips">
        ${manual.map(c => `<span class="cchip"><button data-act="open" data-id="${c.id}" style="font-weight:600">${esc(itemName(c))}</button><button class="x" data-act="unlink" data-id="${c.id}" aria-label="Unlink">✕</button></span>`).join("")}
        ${outgoing.map(c => `<button class="wchip" data-act="open" data-id="${c.id}">[[${esc(c.title)}]]</button>`).join("")}
        ${manual.length + outgoing.length ? "" : `<span class="hint">No threads yet — type [[Another idea's title]] in the content, or pick one below.</span>`}

      <div class="mfoot">

  const $m = (s) => root.querySelector(s);
  $m("#overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") closeModal(); });

  $m("#md-done").addEventListener("click", closeModal);
  $m("#md-type").addEventListener("change", (e) => patchItem(i.id, { type: e.target.value }, false));
  $m("#md-pin").addEventListener("click", () => { patchItem(i.id, { pinned: !i.pinned }, false); renderModal(); });
  $m("#md-title").addEventListener("input", (e) => patchItem(i.id, { title: e.target.value }, false));
  $m("#md-url").addEventListener("input", (e) => patchItem(i.id, { url: e.target.value }, false));
  $m("#md-content").addEventListener("input", (e) => patchItem(i.id, { content: e.target.value }, false));
  $m("#md-status").addEventListener("change", (e) => patchItem(i.id, { status: e.target.value }, false));
  $m("#md-proj").addEventListener("change", (e) => {
    if (e.target.value === "__new") {
      const slot = $m("#md-proj-slot");
      slot.innerHTML = "";
      slot.appendChild(newProjectInline(
        (name) => { patchItem(i.id, { projectId: addProject(name) }, false); renderModal(); },
        () => renderModal()
      ));
    } else patchItem(i.id, { projectId: e.target.value || null }, false);
  });
  const conn = $m("#md-connect");
  if (conn) conn.addEventListener("change", (e) => { if (e.target.value) { toggleLink(i.id, e.target.value); renderModal(); } });
  $m("#md-del").addEventListener("click", (e) => {
    const b = e.currentTarget;
    if (b.dataset.armed === "1") { closeModal(); deleteItem(i.id); }
    else {
      b.dataset.armed = "1"; b.classList.add("armed"); b.textContent = "Tap again to delete";
      setTimeout(() => { if (b.isConnected) { b.dataset.armed = "0"; b.classList.remove("armed"); b.textContent = "Delete"; } }, 3000);
    }
  });
}

/* ————— export / import ————— */
function exportJson() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "everything-board-backup.json"; a.click();
  URL.revokeObjectURL(url);
}
function importJson(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.items) || !Array.isArray(d.projects)) throw new Error("bad shape");
      state = normalize(d); persist(); renderCaptureRow(); renderMain();
    } catch (e) { capMsg("That file doesn't look like an Everything Board backup."); }
  };
  r.readAsText(file);
}

/* ————— global events ————— */
document.addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;
  if (a === "noop") { e.stopPropagation(); return; }
  if (a === "tag") { e.stopPropagation(); goTag(act.dataset.tag); return; }
  if (a === "view") { setView(act.dataset.view); return; }
  if (a === "open") { e.stopPropagation(); openModal(act.dataset.id); return; }
  if (a === "pin") { e.stopPropagation(); const it = byId(act.dataset.id); patchItem(it.id, { pinned: !it.pinned }); return; }
  if (a === "unlink") { e.stopPropagation(); toggleLink(openId, act.dataset.id); renderModal(); return; }
  if (a === "zoom") { mapZoom = Math.min(1.6, Math.max(0.4, +(mapZoom + 0.15 * (+act.dataset.d)).toFixed(2))); applyPan(); return; }
  if (a === "center") { mapPan = { x: -W/2 + 200, y: -H/2 + 200 }; mapZoom = 1; applyPan(); return; }
  if (a === "np-open") {
    const slot = document.getElementById("np-slot");
    slot.innerHTML = "";
    slot.appendChild(newProjectInline((name) => { addProject(name); renderMain(); }, () => renderMain()));
    return;
  }
  if (a === "del-proj") {
    const b = act;
    if (b.dataset.armed === "1") {
      const pid = b.dataset.id;
      state.projects = state.projects.filter(p => p.id !== pid);
      state.items.forEach(i => { if (i.projectId === pid) { i.projectId = null; i.updatedAt = Date.now(); } });
      state.tombstones["p:" + pid] = Date.now();
      persist(); renderMain();
    } else {
      b.dataset.armed = "1"; b.textContent = "Remove project? (items stay)";
      b.style.cssText = "background:var(--red);color:#fff;font-weight:700;padding:2px 8px;border-radius:6px";
      setTimeout(() => { if (b.isConnected) renderMain(); }, 3000);
    }
    return;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.matches(".card,.frow")) { openModal(e.target.dataset.id); }
  if (e.key === "Escape") {
    if (document.querySelector("#sy-overlay")) return closeSyncPanel();
    if (openId) closeModal();
  }
});

/* board drag & drop */
document.addEventListener("dragstart", (e) => {
  const card = e.target.closest(".card[draggable]");
  if (card) e.dataTransfer.setData("text/plain", card.dataset.id);
});
document.addEventListener("dragover", (e) => {
  const col = e.target.closest(".colu");
  if (col) { e.preventDefault(); col.classList.add("over"); }
});
document.addEventListener("dragleave", (e) => {
  const col = e.target.closest(".colu");
  if (col) col.classList.remove("over");
});
document.addEventListener("drop", (e) => {
  const col = e.target.closest(".colu");
  if (!col) return;
  e.preventDefault(); col.classList.remove("over");
  const id = e.dataTransfer.getData("text/plain");
  if (id) patchItem(id, { status: col.dataset.status });
});

/* capture bar wiring */
document.getElementById("cap-text").addEventListener("input", () => { if (!capType) renderCaptureRow(); });
document.getElementById("cap-text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) capSubmit();
});
document.getElementById("cap-types").addEventListener("click", (e) => {
  const tbtn = e.target.closest("[data-cap-type]");
  if (tbtn) { const t = tbtn.dataset.capType; capType = capType === t ? null : t; renderCaptureRow(); return; }
  if (e.target.closest("#cap-img-btn")) { document.getElementById("cap-file").click(); return; }
  if (e.target.closest("#cap-add")) { capSubmit(); return; }
});
document.getElementById("cap-types").addEventListener("change", (e) => {
  if (e.target.id === "cap-proj") {
    if (e.target.value === "__new") {
      const slot = document.getElementById("cap-proj-slot");
      slot.innerHTML = "";
      slot.appendChild(newProjectInline(
        (name) => { capProject = addProject(name); renderCaptureRow(); },
        () => renderCaptureRow()
      ));
    } else capProject = e.target.value;
  }
  if (e.target.id === "cap-file") {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (f.size > 2 * 1024 * 1024) { capMsg("That image is over 2 MB — resize it or paste an image URL instead."); e.target.value = ""; return; }
    capMsg("");
    const r = new FileReader();
    r.onload = () => capSubmit({ imageData: r.result, title: document.getElementById("cap-text").value.trim().split("\n")[0] || f.name });
    r.readAsDataURL(f);
    e.target.value = "";
  }
});

/* header wiring */
document.getElementById("search").addEventListener("input", (e) => { query = e.target.value; renderMain(); });
document.getElementById("hits").addEventListener("click", () => {
  query = ""; document.getElementById("search").value = ""; renderMain();
});
document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-view]");
  if (b) setView(b.dataset.view);
});
const menuBtn = document.getElementById("menu-btn"), menu = document.getElementById("menu");
menuBtn.addEventListener("click", (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; });
document.addEventListener("click", (e) => { if (!e.target.closest(".menu-wrap")) menu.hidden = true; });
document.getElementById("m-export").addEventListener("click", () => { exportJson(); menu.hidden = true; });
document.getElementById("m-import").addEventListener("click", () => { document.getElementById("import-file").click(); menu.hidden = true; });
document.getElementById("import-file").addEventListener("change", (e) => {
  if (e.target.files && e.target.files[0]) importJson(e.target.files[0]);
  e.target.value = "";
});
document.getElementById("m-erase").addEventListener("click", (e) => {
  const b = e.currentTarget;
  if (b.dataset.armed === "1") {
    /* Erasing has to say so, not just forget: without tombstones the next pull
       merges the workspace copy straight back in, and the erase undoes itself
       within fifteen seconds. Existing tombstones are kept — dropping them would
       resurrect long-deleted cards the same way. */
    const tombs = { ...state.tombstones }, at = Date.now();
    state.items.forEach(i => tombs[i.id] = at);
    state.projects.forEach(pr => tombs["p:" + pr.id] = at);
    state = { items: [], projects: [], tombstones: tombs };
    persist(); renderCaptureRow(); renderMain(); menu.hidden = true;
    b.dataset.armed = "0"; b.textContent = "Erase all data";
  } else {
    b.dataset.armed = "1"; b.textContent = "Tap again to erase everything";
    setTimeout(() => { b.dataset.armed = "0"; b.textContent = "Erase all data"; }, 3000);
  }
});

/* Shipshape's quick-idea sheet writes into this page's localStorage from the
   other page. In the same window that is a navigation and loadData() sees it,
   but on a desktop the two can be open side by side — so a write from over
   there merges into memory here rather than being overwritten by this page's
   next persist(). */
addEventListener("storage", (e) => {
  if (e.key !== KEY || !e.newValue) return;
  try {
    const merged = normalize(mergeStates(state, normalize(JSON.parse(e.newValue))));
    if (JSON.stringify(merged) !== JSON.stringify(state)) {
      state = merged;
      renderCaptureRow(); renderMain();
      if (openId && byId(openId)) renderModal();
    }
  } catch (err) {}
});

/* ————— boot ————— */
renderCaptureRow();
/* Shipshape links straight to a project's cards with #p=<id> */
const hp = location.hash.match(/^#p=(.+)$/);
if (hp) {
  const pid = decodeURIComponent(hp[1]);
  capProject = proj(pid) ? pid : "";
  setView("projects");
  renderCaptureRow();
  history.replaceState(null, "", location.pathname + location.search);
  const sec = document.getElementById("sec-" + (proj(pid) ? pid : "none"));
  if (sec) sec.scrollIntoView({ block: "start" });
} else setView("home");
/* the map tab does not exist on a phone, so the view must not linger there when
   the window shrinks across the threshold */
function ensureViewFits() {
  if (view === "map" && matchMedia("(max-width:860px)").matches) setView("home");
}
addEventListener("resize", ensureViewFits);
ensureViewFits();
/* a keyboard shortcut in the placeholder is noise on a screen with no keyboard */
if (matchMedia("(pointer:coarse)").matches) {
  const ta = document.getElementById("cap-text");
  ta.placeholder = "Throw anything in — thoughts, links, pasted emails. #tags and [[other idea]] connect.";
}
/* Shipshape's + menu sends "New idea" here with #new: land ready to type, which
   on a phone means the keyboard is already up. */
if (location.hash === "#new") {
  history.replaceState(null, "", location.pathname + location.search);
  const ta = document.getElementById("cap-text");
  ta.scrollIntoView({ block: "start" });
  setTimeout(() => ta.focus(), 60);
}

/* ————————————————————————————————————————————
   Sync · rides the Shipshape workspace
   ————————————————————————————————————————————
   The board syncs through the same Supabase project, anon key and workspace the
   main app is already set up with — read straight from Shipshape's saved config,
   since both pages live on one origin. Nothing new to configure, no sign-in, no
   extra SQL: the whole board travels as one document in shipshape_state under
   the key `<workspace>:board`, beside (never touching) Shipshape's own row, and
   merges last-write-wins per item using the timestamps every mutation here
   already stamps.

   The rules from the main app's hard lessons apply unchanged: the poll stays at
   15 seconds, a failed push always retries, and coming back — to the network,
   the tab or the app — catches up in both directions. */
/* merge two states: per-item/project newest-updatedAt wins; tombstones beat older records */
function mergeStates(a, b) {
  const ts = (x) => x.updatedAt || x.createdAt || 0;
  const tombs = {};
  for (const [k, v] of Object.entries({ ...(a.tombstones||{}), ...(b.tombstones||{}) }))
    tombs[k] = Math.max((a.tombstones||{})[k] || 0, (b.tombstones||{})[k] || 0);
  // sixty days on, every live copy has long since dropped the record itself,
  // so the marker has nothing left to defeat — same convention as the main app
  const cut = Date.now() - 60 * 864e5;
  for (const k of Object.keys(tombs)) if (tombs[k] < cut) delete tombs[k];
  const pick = (list) => {
    const m = new Map();
    list.forEach(x => {
      if (!x || !x.id) return;
      const prev = m.get(x.id);
      if (!prev || ts(x) > ts(prev)) m.set(x.id, x);
    });
    return m;
  };
  const items = [...pick([...(a.items||[]), ...(b.items||[])]).values()]
    .filter(i => !(tombs[i.id] && tombs[i.id] >= ts(i)))
    .sort((x, y) => (y.createdAt||0) - (x.createdAt||0));
  const projects = [...pick([...(a.projects||[]), ...(b.projects||[])]).values()]
    .filter(p => !(tombs["p:" + p.id] && tombs["p:" + p.id] >= ts(p)));
  return { items, projects, tombstones: tombs };
}
const SS_KEY = "shipshape:sync";
const ss = { status:"off", lastPushed:"", pushT:null, retryT:null, fails:0, pulling:false };
function ssCfg() {
  try {
    const raw = localStorage.getItem(SS_KEY);
    if (raw) { const c = JSON.parse(raw); if (c && c.on && c.url && c.key && c.ws) return c; }
  } catch (e) {}
  return null;
}
const boardKey = (c) => c.ws + ":board";
async function ssRpc(c, fn, body) {
  const r = await fetch(c.url.replace(/\/+$/,"") + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: { "Content-Type":"application/json", apikey:c.key, Authorization:"Bearer "+c.key },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
function setSyncStatus(st, detail) {
  ss.status = st; ss.detail = detail || "";
  const btn = document.getElementById("sync-btn");
  if (btn) {
    btn.querySelector(".dot").style.background =
      { off:"#98989d", syncing:"#0A84FF", synced:"#30D158", offline:"#FF9F0A", error:"#FF453A" }[st] || "#98989d";
    btn.title = { off:"Sync is off — set it up in Shipshape", syncing:"Syncing…", synced:"Synced through your Shipshape workspace",
      offline:"Offline — the board is saved here and goes out when the network is back",
      error:"Cannot reach Supabase" }[st] || "Sync";
  }
  const panel = document.getElementById("sync-root");
  if (panel && panel.innerHTML) renderSyncPanel();
}
/* A quiet pull re-renders whatever changed, and a re-render mid-gesture is a
   stolen gesture: the caret jumps out of the modal field, the card being dragged
   stops existing, the map node snaps back. Same reasoning as the main app's
   "never rebuild a container that holds a row" — but this page re-renders
   wholesale by design, so instead the pull waits until the hands are off. */
let pointerDownAt = 0, dragLive = false;
addEventListener("pointerdown", () => pointerDownAt = Date.now(), true);
addEventListener("pointerup", () => pointerDownAt = 0, true);
addEventListener("pointercancel", () => pointerDownAt = 0, true);
addEventListener("blur", () => pointerDownAt = 0);
addEventListener("dragstart", () => dragLive = true, true);
addEventListener("dragend", () => dragLive = false, true);
addEventListener("drop", () => dragLive = false, true);
function uiBusy() {
  /* a mouse released outside the window never reports its pointerup, so a held
     pointer only counts as busy for so long — a stuck flag must not starve sync */
  if (pointerDownAt && Date.now() - pointerDownAt < 30000) return true;
  if (dragLive) return true;
  if (openId !== null) return true;                       // modal open: fields in use
  const cap = document.getElementById("cap-text");
  return document.activeElement === cap && cap.value.trim() !== "";
}
async function pullBoard(quiet) {
  const cfg = ssCfg();
  if (!cfg) { setSyncStatus("off"); return; }
  if (quiet && uiBusy()) return;
  if (ss.pulling) return;
  ss.pulling = true; setSyncStatus("syncing");
  try {
    const remote = await ssRpc(cfg, "shipshape_pull", { k: boardKey(cfg) });
    const merged = normalize(mergeStates(state, normalize(remote || {})));
    const mergedStr = JSON.stringify(merged);
    if (mergedStr !== JSON.stringify(state)) {
      state = merged;
      try { if (!memoryOnly) localStorage.setItem(KEY, mergedStr); } catch (e) {}
      renderCaptureRow(); renderMain();
      if (openId && byId(openId)) renderModal(); else if (openId) closeModal();
    }
    if (!remote || mergedStr !== JSON.stringify(normalize(remote))) await pushBoard(true);
    else { ss.lastPushed = mergedStr; setSyncStatus("synced"); }
  } catch (e) {
    setSyncStatus(navigator.onLine ? "error" : "offline", String(e.message || e));
  } finally { ss.pulling = false; }
}
async function pushBoard(force) {
  const cfg = ssCfg();
  if (!cfg) { setSyncStatus("off"); return; }
  const snap = JSON.stringify(state);
  if (!force && snap === ss.lastPushed) { setSyncStatus("synced"); return; }
  setSyncStatus("syncing");
  try {
    await ssRpc(cfg, "shipshape_push", { k: boardKey(cfg), d: state });
    ss.lastPushed = snap; ss.fails = 0; clearTimeout(ss.retryT);
    setSyncStatus("synced");
  } catch (e) {
    /* a push is never dropped: back off and try again until it lands */
    setSyncStatus(navigator.onLine ? "error" : "offline", String(e.message || e));
    clearTimeout(ss.retryT);
    const wait = Math.min(60000, 1500 * Math.pow(2, Math.min(ss.fails++, 5)));
    ss.retryT = setTimeout(() => pushBoard(), wait);
  }
}
function schedulePush() {
  if (!ssCfg()) return;
  clearTimeout(ss.pushT);
  ss.pushT = setTimeout(() => pushBoard(), 900);
}
const boardPending = () => !!ssCfg() && JSON.stringify(state) !== ss.lastPushed;
function ssResume() {
  if (!ssCfg()) { setSyncStatus("off"); return; }
  pullBoard(true);
  if (boardPending()) schedulePush();
}
window.addEventListener("focus", ssResume);
window.addEventListener("online", ssResume);
document.addEventListener("visibilitychange", () => { if (!document.hidden) ssResume(); });
/* fifteen seconds, same as the main app — see its working notes for why this
   never slows down on any "live" signal */
setInterval(() => { if (ssCfg() && !document.hidden) pullBoard(true); }, 15000);

/* ————— sync panel ————— */
function openSyncPanel() { renderSyncPanel(); }
function closeSyncPanel() { document.getElementById("sync-root").innerHTML = ""; }
function renderSyncPanel() {
  const root = document.getElementById("sync-root");
  const cfg = ssCfg();
  const nice = { syncing:"Syncing…", synced:"Synced ✓",
    offline:"Offline — the board is saved on this device and goes out when the network is back.",
    error:"Cannot reach Supabase." + (ss.detail ? " (" + ss.detail + ")" : "") }[ss.status] || "";
  const body = cfg
    ? `<p style="font-size:13px;margin-bottom:4px">Synced through your <b>Shipshape workspace</b> — same project, same key, nothing extra to set up.</p>
       <p style="font-size:13px;color:${ss.status === "error" ? "var(--red)" : "var(--label2)"};margin-bottom:12px">${esc(nice)}</p>
       <div style="display:flex;gap:8px;flex-wrap:wrap">
         <button class="btn-done" id="sy-now">Sync now</button>
         <a class="btn-mini" href="index.html#sync" style="text-decoration:none;display:inline-flex;align-items:center">Sync settings…</a>
       </div>
       <p class="hint" style="margin-top:10px">The board travels as its own document beside your tasks — turning either off never touches the other's data.</p>`
    : `<p style="font-size:13px;color:var(--label2);margin-bottom:12px">The board follows Shipshape's sync. Turn sync on there — cloud button, top right — and the board rides the same workspace with nothing else to configure.</p>
       <a class="btn-done" href="index.html#sync" style="text-decoration:none;display:inline-block">Open Shipshape sync setup</a>`;
  root.innerHTML = `<div class="overlay" id="sy-overlay">
    <div class="modal" role="dialog" aria-modal="true" style="max-width:460px">
      <div class="mrow"><span style="font-weight:800">☁ Sync</span><span class="spacer"></span>
        <button class="btn-mini" id="sy-close" aria-label="Close">✕</button></div>
      ${body}
    </div></div>`;
  root.querySelector("#sy-overlay").addEventListener("click", (e) => { if (e.target.id === "sy-overlay") closeSyncPanel(); });
  root.querySelector("#sy-close").addEventListener("click", closeSyncPanel);
  const now = root.querySelector("#sy-now");
  if (now) now.addEventListener("click", () => pullBoard());
}
document.getElementById("sync-btn").addEventListener("click", openSyncPanel);
pullBoard(true);

/* Offline support comes from the same service worker as the rest of Shipshape;
   registered here too so landing on the board first still installs it. */
if ("serviceWorker" in navigator && window.isSecureContext) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

</script>
</body>
